name: Feature request
description: Suggest a new capability or an improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Backend, Frontend / driver app, API contract, Design, Docs, CI / tooling]
    validations:
      required: true
  - type: textarea
    id: main
    attributes:
      label: Problem
      description: What need or pain point does this address?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Proposed solution
