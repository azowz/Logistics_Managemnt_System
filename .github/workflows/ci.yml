# Logistic X Operations API — continuous integration.
#
# Runs on every push and pull request: installs the pinned dependencies, checks
# formatting/lint, runs an advisory type check, and executes the test suite.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint, type-check & test
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: logistic-x-backend

    # A real PostgreSQL and Redis available for tests that need them.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: logistic_x
          POSTGRES_PASSWORD: logistic_x
          POSTGRES_DB: logistic_x
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logistic_x -d logistic_x"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Tests connect as a NON-superuser role (created below): the postgres image's
      # POSTGRES_USER is always a superuser, and superusers bypass row-level
      # security even with FORCE — which would make every RLS assertion vacuous.
      DATABASE_URL: postgresql+psycopg2://logistic_x_app:logistic_x_app@localhost:5432/logistic_x
      # TEST_DATABASE_URL enables the tests/test_tenant_isolation_pg.py gate. It
      # points at the same NON-superuser app role so the RLS assertions are
      # meaningful. Enabled in Sprint 15A: migration 0018 makes the tenant
      # policies fail closed on an empty GUC (NULLIF), fixing the empty-`''::uuid`
      # cast error that previously blocked this gate.
      TEST_DATABASE_URL: postgresql+psycopg2://logistic_x_app:logistic_x_app@localhost:5432/logistic_x
      SECRET_KEY: ci-test-secret-not-for-production
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      ENVIRONMENT: test
      LOG_JSON: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: logistic-x-backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Create non-superuser application role
        # RLS (even with FORCE) never applies to superusers, and the postgres
        # image's POSTGRES_USER is a superuser. Tests must run as this role for
        # the RLS isolation assertions to prove anything.
        env:
          PGPASSWORD: logistic_x
        run: |
          psql -h localhost -U logistic_x -d logistic_x -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE logistic_x_app LOGIN PASSWORD 'logistic_x_app'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          GRANT USAGE, CREATE ON SCHEMA public TO logistic_x_app;
          SQL

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check -l 100 app

      - name: Mypy (type check)
        run: mypy app

      - name: Migrations (upgrade head + model drift check)
        # Fails when the ORM models and the migration chain disagree, so a later
        # `alembic revision --autogenerate` can never propose dropping indexes
        # or defaults that production relies on.
        run: |
          alembic upgrade head
          alembic check

      - name: Pytest
        run: pytest -q

      - name: Check API contract and migration baseline
        run: python -m scripts.check_contract

  frontend:
    name: Frontend independent build and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: logistic-x-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: logistic-x-frontend/package-lock.json
      - run: npm ci
      - run: npm run api:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  contract-distribution:
    name: Published API snapshots agree
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmp logistic-x-backend/api/openapi.json contracts/openapi.json
          cmp logistic-x-backend/api/openapi.json logistic-x-frontend/api/openapi.json

  integration:
    name: Disposable Docker stack and real browser workflow
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: logistic-x-frontend/package-lock.json
      - name: Build isolated applications
        run: |
          cp logistic-x-backend/.env.example logistic-x-backend/.env
          docker compose -p logistic-x-separation-verify -f docker-compose.yml -f compose.verify.yml build api frontend
          docker compose -p logistic-x-separation-verify -f docker-compose.yml -f compose.verify.yml up -d --wait db redis
          docker compose -p logistic-x-separation-verify -f docker-compose.yml -f compose.verify.yml run --rm --no-deps api python -m alembic upgrade head
          docker compose -p logistic-x-separation-verify -f docker-compose.yml -f compose.verify.yml up -d --no-build --wait api worker beat frontend
      - name: Install browser tests
        working-directory: logistic-x-frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Live authenticated workflow
        working-directory: logistic-x-frontend
        env:
          FRONTEND_TEST_URL: http://127.0.0.1:18081
          LOGISTIC_X_TEST_API_URL: http://127.0.0.1:18000/v1
        run: npm run test:integration
      - name: Independent restart verification
        run: node scripts/verify-lifecycle.mjs
      - name: Stop verification services
        if: always()
        run: docker compose -p logistic-x-separation-verify -f docker-compose.yml -f compose.verify.yml down
