# Mesaar Logistics Operations API — local development orchestration.
#
# Services:
#   api    — FastAPI application served by gunicorn+uvicorn (app.main:app)
#   worker — Celery worker consuming app.workers.celery_app tasks
#   beat   — Celery beat scheduler for periodic tasks
#   db     — PostgreSQL 16 primary datastore
#   redis  — Redis 7 (cache + Celery broker/result backend)
#
# All application services share the same image and load configuration from the
# .env file (copy .env.example -> .env first). The db/redis hostnames below
# override the localhost defaults from the canonical settings so containers can
# reach each other on the compose network.

name: mesaar

services:
  api:
    build:
      context: ./mesaar-backend
      dockerfile: Dockerfile
    image: mesaar/api:latest
    restart: unless-stopped
    env_file:
      - ./mesaar-backend/.env
    environment:
      CORS_ORIGINS: '${MESAAR_CORS_ORIGINS:-["http://localhost:8081","http://127.0.0.1:8081"]}'
      # Container-network service discovery overrides.
      DATABASE_URL: postgresql+psycopg2://mesaar_app:mesaar_app@db:5432/mesaar
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: mesaar/api:latest
    build:
      context: ./mesaar-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.workers.celery_app
      - worker
      - --loglevel=info
      - --concurrency=4
    env_file:
      - ./mesaar-backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://mesaar_app:mesaar_app@db:5432/mesaar
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  beat:
    image: mesaar/api:latest
    build:
      context: ./mesaar-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.workers.celery_app
      - beat
      - --loglevel=info
      - --pidfile=/tmp/celerybeat.pid
      - --schedule=/tmp/celerybeat-schedule
    env_file:
      - ./mesaar-backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://mesaar_app:mesaar_app@db:5432/mesaar
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    # Beat has no HTTP server; override the image's API liveness probe.
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from pathlib import Path; os.kill(int(Path('/tmp/celerybeat.pid').read_text()), 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./mesaar-frontend
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8000/v1}
        EXPO_PUBLIC_APP_ENV: ${EXPO_PUBLIC_APP_ENV:-development}
    image: mesaar/frontend:latest
    restart: unless-stopped
    ports:
      - "8081:8081"
    # No depends_on: the frontend serves its shell with the backend stopped.

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mesaar
      POSTGRES_PASSWORD: mesaar
      POSTGRES_DB: mesaar
    ports:
      - "5432:5432"
    volumes:
      - mesaar_pgdata:/var/lib/postgresql/data
      - ./mesaar-backend/docker/postgres/init-app-role.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesaar -d mesaar"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - mesaar_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mesaar_pgdata:
  mesaar_redisdata:
